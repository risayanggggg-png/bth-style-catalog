backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "products"
    label: "Katalog Produk"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Nama Produk", name: "title", widget: "string"}
      - {label: "Kategori", name: "category", widget: "select", options: ["Classic", "Collab", "Jibbitz", "All-Terrain", "Kids"]}
      - {label: "Harga (Rupiah)", name: "price", widget: "number"}
      - {label: "Stok", name: "stock", widget: "number"}
      - {label: "Foto Produk", name: "image", widget: "image"}
      - {label: "Deskripsi & Ukuran", name: "body", widget: "markdown"}
